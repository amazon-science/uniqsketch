name: CI

# Build the three tools and run the full test suite on every push and pull
# request. Until this workflow existed the only automated check was GitHub's
# default CodeQL setup, so `make test` never ran on a PR and releases were
# merged on local verification alone.
#
# The matrix covers both build systems the README documents (Make and CMake)
# and both compiler families it claims to support (GCC and Clang), because only
# GCC via Make had ever been exercised.

on:
  push:
    branches: [main, "v*-dev"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.build }} / ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build: [make, cmake]
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        # Retried: on 11 Nov 2026 all four jobs of a run failed here because the
        # runner could not resolve archive.ubuntu.com for ten minutes (run
        # 43045040713); nothing of ours had executed. Three attempts a minute
        # apart cover a transient mirror or DNS outage without hiding a real one.
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update && \
               sudo apt-get install -y --no-install-recommends \
                 build-essential cmake zlib1g-dev clang libomp-dev; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying in 60 s"
            sleep 60
          done
          exit 1

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang"    >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc"      >> "$GITHUB_ENV"
            echo "CXX=g++"     >> "$GITHUB_ENV"
          fi

      - name: Build and test (Make)
        if: matrix.build == 'make'
        # The Makefile bakes the standard into CXX ("g++ -std=c++17"), so an
        # override must carry the flag or the standard is silently dropped.
        run: |
          make CXX="$CXX -std=c++17"
          make test CXX="$CXX -std=c++17"

      - name: Build and test (CMake)
        if: matrix.build == 'cmake'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Smoke-test the binaries
        run: |
          if [ "${{ matrix.build }}" = "make" ]; then BIN=bin; else BIN=build/bin; fi
          "$BIN/uniqsketch"    --version
          "$BIN/querysketch"   --version
          "$BIN/comparesketch" --version

  sanitizers:
    # AddressSanitizer and UndefinedBehaviorSanitizer over the seven suites and the
    # tree rule-stack test, which runs the real uniqsketch and querysketch through
    # an index build and some 70 queries (test/tree_rules). The first such run found a
    # use-after-free on every --tree build that renames a node, a test reading
    # past its strings, and an integer conversion of NaN on an empty --solid
    # sample; none of them changed a result, and none was visible to the matrix
    # above. -fno-sanitize-recover makes an undefined-behaviour report fatal, so
    # the exit status of `make test` is the verdict. -O1 keeps the instrumented
    # suites to a few minutes.
    name: ASan + UBSan
    runs-on: ubuntu-latest
    env:
      SAN_CXX: g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1
      # The suites and tools take the machine's thread count from OpenMP; four is
      # what the runner has, stated so that a larger runner does not change the test.
      OMP_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update && \
               sudo apt-get install -y --no-install-recommends \
                 build-essential zlib1g-dev; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying in 60 s"
            sleep 60
          done
          exit 1

      - name: Build the tools with the sanitizers
        # OPTFLAGS is overridden so that the Makefile's -O3 does not replace -O1.
        run: make CXX="$SAN_CXX" OPTFLAGS="-fopenmp"

      - name: Unit suites and tree rule-stack test under the sanitizers
        run: make test CXX="$SAN_CXX" OPTFLAGS="-fopenmp"
